[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coc-helper"
version = "0.1.0"
description = "Clash of Clans war tracker and QQ bot"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
bot = [
    "nonebot2[fastapi]>=2.5.0",
    "nonebot-adapter-onebot>=2.4.6",
    "pillow>=10.0",
]
dev = [
    "pytest>=8.0",
]

[tool.setuptools]
packages = ["coc_helper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
